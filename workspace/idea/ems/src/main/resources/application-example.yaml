deepseek:
  api-key: your-api-key-here
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat
  temperature: 0.2
  max-tokens: 2048

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: your-db-username
    password: your-db-password
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

file:
  upload:
    root-path: D:/upload/file/
    temp-root-path: D:/upload/temp/
    allow-types: jpg,png,jpeg,gif,pdf
    first-level-length: 2
    second-level-length: 3
    max-size: 10485760

mybatis-plus:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.neuedu.ems.entity,com.neuedu.ems.vo
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  level:
    com.neuedu.ems.mapper: debug
    org.apache.ibatis: debug
    org.mybatis: debug
    java.sql: debug

server:
  port: 8088

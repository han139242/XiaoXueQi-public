spring.application.name=ems
server.port=8088

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=EmsHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:3}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME_MS:300000}

mybatis.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath:mappers/*.xml
mybatis-plus.type-aliases-package=com.neuedu.ems.entity,com.neuedu.ems.vo
mybatis-plus.configuration.map-underscore-to-camel-case=true
logging.level.com.neuedu.ems.mapper=info

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

file.upload.root-path=${FILE_UPLOAD_ROOT:D:/upload/file/}
file.upload.temp-root-path=${FILE_UPLOAD_TEMP_ROOT:D:/upload/temp/}
file.upload.allow-types=jpg,png,jpeg,gif,pdf
file.upload.first-level-length=2
file.upload.second-level-length=3
file.upload.max-size=10485760

mes.ai.enabled=${AI_ENABLED:true}
mes.ai.api-url=${AI_API_URL:https://api.deepseek.com}
mes.ai.api-key=${AI_API_KEY:}
mes.ai.model=${AI_MODEL:deepseek-chat}
mes.ai.max-context-chars=${AI_MAX_CONTEXT_CHARS:5000}
mes.ai.max-answer-chars=${AI_MAX_ANSWER_CHARS:8000}

mes.auth.max-login-attempts=${AUTH_MAX_LOGIN_ATTEMPTS:5}

mes.notification.outbox-initial-delay-ms=${NOTIFICATION_OUTBOX_INITIAL_DELAY_MS:10000}
mes.notification.scheduling-enabled=${NOTIFICATION_SCHEDULING_ENABLED:true}
mes.notification.outbox-fixed-delay-ms=${NOTIFICATION_OUTBOX_FIXED_DELAY_MS:5000}
mes.notification.outbox-batch-size=${NOTIFICATION_OUTBOX_BATCH_SIZE:50}
mes.notification.outbox-max-retries=${NOTIFICATION_OUTBOX_MAX_RETRIES:5}
mes.notification.mfg-scan-initial-delay-ms=${NOTIFICATION_MFG_SCAN_INITIAL_DELAY_MS:15000}
mes.notification.mfg-scan-fixed-delay-ms=${NOTIFICATION_MFG_SCAN_FIXED_DELAY_MS:60000}

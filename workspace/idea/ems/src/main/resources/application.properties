spring.application.name=ems
server.port=8088

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath:mappers/*.xml
mybatis-plus.type-aliases-package=com.neuedu.ems.entity,com.neuedu.ems.vo
mybatis-plus.configuration.map-underscore-to-camel-case=true
logging.level.com.neuedu.ems.mapper=info

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

file.upload.root-path=${FILE_UPLOAD_ROOT:D:/upload/file/}
file.upload.temp-root-path=${FILE_UPLOAD_TEMP_ROOT:D:/upload/temp/}
file.upload.allow-types=jpg,png,jpeg,gif,pdf
file.upload.first-level-length=2
file.upload.second-level-length=3
file.upload.max-size=10485760

mes.ai.enabled=${AI_ENABLED:false}
mes.ai.api-url=${AI_API_URL:https://blackaicoding.com/}
mes.ai.api-key=${AI_API_KEY:}
mes.ai.model=${AI_MODEL:gpt-5.5}
mes.ai.reasoning-effort=${AI_REASONING_EFFORT:high}
mes.ai.max-tokens=${AI_MAX_TOKENS:1200}
mes.ai.max-context-chars=${AI_MAX_CONTEXT_CHARS:5000}
mes.ai.max-answer-chars=${AI_MAX_ANSWER_CHARS:8000}

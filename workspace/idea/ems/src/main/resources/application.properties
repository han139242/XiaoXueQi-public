spring.application.name=ems
server.port=8088

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath:mappers/*.xml
mybatis-plus.type-aliases-package=com.neuedu.ems.entity,com.neuedu.ems.vo
mybatis-plus.configuration.map-underscore-to-camel-case=true
logging.level.com.neuedu.ems.mapper=debug

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

file.upload.root-path=D:/upload/file/
file.upload.temp-root-path=D:/upload/temp/
file.upload.allow-types=jpg,png,jpeg,gif,pdf
file.upload.first-level-length=2
file.upload.second-level-length=3
file.upload.max-size=10485760
